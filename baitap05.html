<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài tập 05 - Định dạng bảng CSS</title>
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .tablelist {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 0;
      border-collapse: collapse;
      border-spacing: 0px;
      border: 1px solid #EBDDBC;
    }
    .tablelist th {
      margin: 0;
      padding: 4px 6px;
      border: 1px solid #EBDDBC;
      background-color: #F1EFD8;
    }
    .tablelist td {
      margin: 0;
      padding: 4px;
      border: 1px solid #EBDDBC;
    }
  </style>
</head>
<body>
  <H3>DANH SÁCH NHÂN VIÊN</H3>
  <table class="tablelist">
    <tr>
      <th>Số thứ tự</th>
      <th>Họ và tên</th>
      <th>Giới tính</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Nguyễn Quang Thọ</td>
      <td>Nam</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Trần Mai Dung</td>
      <td>Nữ</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Lê Văn Hùng</td>
      <td>Nam</td>
    </tr>
  </table>
</body>
</html>
