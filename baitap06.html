<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài tập 06 - Menu ngang 1 cấp</title>
  <style type="text/css">
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #menu {
      width: 900px;
      height: 35px;
      background-color: #0FF;
      overflow: hidden;
    }
    #menu a {
      display: block;
      height: 30px;
      padding-top: 5px;
      width: 120px;
      float: left;
      text-align: center;
      text-decoration: none;
      color: #000;
      box-sizing: border-box;
    }
    #menu a:hover {
      background-color: #00F;
      color: #FFF;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="menu">
    <a href="#">Trang chủ</a>
    <a href="#">Giới thiệu</a>
    <a href="#">Bản đồ</a>
    <a href="#">Liên hệ</a>
    <a href="#">Sản phẩm</a>
  </div>
</body>
</html>
