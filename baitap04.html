<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài tập 04 - Menu dọc 1 tầng</title>
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    #menu {
      width: 200px;
    }
    #menu a {
      display: block;
      height: 32px;
      line-height: 32px;
      background-color: #4a90d9;
      background-repeat: no-repeat;
      padding-top: 0;
      padding-left: 35px;
      text-decoration: none;
      color: #FFF;
      font-weight: bold;
      margin-bottom: 2px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    #menu a:hover {
      background-color: #2c5f8a;
    }
  </style>
</head>
<body>
  <div id="menu">
    <a href="#">Trang chu</a>
    <a href="#">San pham</a>
    <a href="#">Dich vu</a>
    <a href="#">Lien he</a>
    <a href="#">Dang ky</a>
    <a href="#">Dang nhap</a>
  </div>
</body>
</html>
